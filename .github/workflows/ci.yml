name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          go test ./scripts
          go test ./cmd/xbctl ./cmd/mi-node
          make test

  version:
    name: Resolve fixed version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve version
        id: version
        env:
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          version="$(go run ./scripts/release-manifest.go --version-only --version "$TAG_VERSION")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, version]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload mi-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-node-${{ matrix.goos }}-${{ matrix.goarch }}-${{ needs.version.outputs.version }}
          overwrite: true
          path: mi-node-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

      - name: Upload xbctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}-${{ needs.version.outputs.version }}
          overwrite: true
          path: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="mi-node"
          echo "name=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=mi-node-docker
          cache-to: type=gha,mode=max,scope=mi-node-docker
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, version, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: mi-node-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-linux-*-${{ needs.version.outputs.version }}"
          merge-multiple: true
          path: dist
      - name: Generate release manifest
        run: |
          go run ./scripts/release-manifest.go --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" --dir dist --output dist/node-release.json
      - name: Publish complete immutable release
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            existing_tag="$(git ls-remote --tags origin "refs/tags/$VERSION")"
            if [ -n "$existing_tag" ]; then
              echo "Tag $VERSION already exists; refusing to reuse it." >&2
              exit 1
            fi
          fi
          # Keep partial uploads out of /releases/latest until all five assets exist.
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --draft --generate-notes
          gh release upload "$VERSION" \
            dist/mi-node-linux-amd64 dist/mi-node-linux-arm64 \
            dist/xbctl-linux-amd64 dist/xbctl-linux-arm64 dist/node-release.json
          # An older, slower build must never move latest back from a newer release.
          if ! current_latest="$(gh release view --json tagName --jq .tagName)"; then
            # Confirm an empty release history before promoting the first release.
            published_release="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')"
            if [ -n "$published_release" ]; then
              echo "Latest lookup failed despite existing published releases; promotion stopped." >&2
              exit 1
            fi
            current_latest=""
          fi
          promote=true
          if [[ "$current_latest" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            newest="$(printf '%s\n%s\n' "$current_latest" "$VERSION" | sort -V | tail -n 1)"
            if [ "$newest" != "$VERSION" ]; then promote=false; fi
          fi
          gh release edit "$VERSION" --draft=false --latest="$promote"
          echo "promoted=$promote" >> "$GITHUB_OUTPUT"
      - name: Sync mutable dev compatibility release
        if: ${{ success() && steps.publish.outputs.promoted == 'true' }}
        shell: bash
        run: bash scripts/sync-dev-release.sh "$VERSION" "$GITHUB_SHA" dist
